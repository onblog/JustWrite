appId: com.onblog.miaomiao
productName: 喵喵笔记
copyright: Copyright © 2026 onblog

directories:
  output: release
  buildResources: build

# 直接使用 node_modules 里已解压的 Electron，避免打包时再下载一次
electronDist: node_modules/electron/dist

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # 未签名构建：本地使用可以，分发前需要配置开发者证书
  identity: null

dmg:
  title: 喵喵笔记
  artifactName: miaomiao-notes-${version}-${arch}.${ext}
