appId: com.onblog.miaomiao
productName: 喵喵笔记
copyright: Copyright © 2026 onblog

directories:
  output: release
  buildResources: build

# 不要硬编码 electronDist：node_modules/electron/dist 只有本机架构的内核，
# 指向它会让 --x64 也产出 arm64 的“假 x64”包。交给 electron-builder 按 arch
# 自己取内核，已下载过的版本会命中 ~/Library/Caches/electron，不会重复下载。

files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'

mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: false
  # 架构由命令行 --arm64 / --x64 指定，避免两个 dmg 同时制作时卷名冲突
  target:
    - target: dmg
  # 签名交给 afterPack hook 做 ad-hoc（electron-builder 不认 identity: "-"）
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

afterPack: scripts/after-pack.cjs

dmg:
  title: 喵喵笔记
  artifactName: miaomiao-notes-${version}-${arch}.${ext}
